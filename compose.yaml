services:

  postgres:
    image: postgres:16
    container_name: support-postgres

    environment:
      POSTGRES_DB: supportdb
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d supportdb"]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: support-app

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/supportdb
      DB_USER: support
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data: