name: Support Service CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: supportdb
          POSTGRES_USER: support
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U support -d supportdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      # 1. Получаем исходный код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Настраиваем Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. Проверяем базовые ошибки форматирования
      - name: Check whitespace
        run: git diff --check

      # 5. Собираем приложение и запускаем тесты
      - name: Build and test
        run: ./gradlew clean build jacocoTestReport

        env:
          DB_URL: jdbc:postgresql://localhost:5432/supportdb
          DB_USER: support
          DB_PASSWORD: test_password

      # 6. Сохраняем результаты тестирования
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore

      # 7. Сохраняем отчёт JaCoCo
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          if-no-files-found: ignore