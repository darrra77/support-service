services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: supportdb
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - deploy_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d supportdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/darrra77/support-service:${IMAGE_TAG:?IMAGE_TAG is required}

    ports:
      - "8081:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/supportdb
      DB_USER: support
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  deploy_postgres_data: